# The opt-in weekly install count (voiceio/telemetry.py): POST /ping adds one
# to a per-week counter, GET /ping/stats publishes the totals. See README.md.
name = "voiceio-ping"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
# Its own hostname, so it never shares one with the voiceio-site Custom Domain
# (../../wrangler.jsonc). Paths stay /ping and /ping/stats.
routes = [{ pattern = "ping.voiceio.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "voiceio-ping"
database_id = "cf41ea1b-5c3b-4b3d-ad51-a5c704f8bf5a"

# No Workers Logs: nothing about a request is kept outside the counter.
[observability]
enabled = false
