<!doctype html>
<!-- OG card template (1200x630). Not served (see .assetsignore).
     Rendered by render.mjs with ?k=<kicker>&t=<title>&s=<subline>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Spline+Sans+Mono:wght@400;500&family=Tiny5&display=block">
<style>
:root { --bg: #f6f6f8; --ink: #1d2027; --muted: #5e626c; --faint: #8d9098; --line: #dcdde1; --signal: #9be22d; --dark: #16181d; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Spline Sans Mono", monospace; position: relative;
       background-image: radial-gradient(rgba(0,0,0,.05) 0.7px, transparent 0.8px); background-size: 4px 4px; }
canvas { position: absolute; right: 0; top: 0; width: 600px; height: 630px; }
.frame { position: absolute; inset: 28px; border: 1.5px solid var(--line); }
.in { position: absolute; left: 72px; top: 64px; right: 72px; bottom: 60px; display: flex; flex-direction: column; }
.brand { font: 400 40px/1 "Tiny5", monospace; letter-spacing: 0.06em; }
.io { background: var(--signal); color: var(--dark); padding: 0 6px; border-radius: 3px; }
.kicker { margin-top: auto; font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
h1 { margin-top: 18px; font: 800 96px/0.95 "Bricolage Grotesque", sans-serif; letter-spacing: -0.035em; max-width: 13ch; }
h1 .vs { color: var(--faint); font-weight: 700; }
h1.long { font-size: 80px; }
.sub { margin-top: 26px; font-size: 22px; color: var(--muted); max-width: 46ch; line-height: 1.45; }
.foot { position: absolute; right: 72px; top: 76px; font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
        background: var(--bg); padding: 6px 10px; border: 1.5px solid var(--line); }
</style>
</head>
<body>
<canvas id="c" width="600" height="630"></canvas>
<div class="frame"></div>
<div class="foot">voiceio.dev</div>
<div class="in">
  <div class="brand">VOICE<span class="io">IO</span><span style="opacity:.45">_</span></div>
  <div class="kicker" id="k"></div>
  <h1 id="t"></h1>
  <p class="sub" id="s"></p>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("k").textContent = q.get("k") || "// compare";
const t = (q.get("t") || "voiceio vs Voxtype").replace(/-/g, "\u2011");
const h = document.getElementById("t");
// "voiceio vs X": dim the "vs"
const m = t.match(/^(voiceio) vs (.+)$/);
if (m) { h.append(m[1] + " "); const v = document.createElement("span"); v.className = "vs"; v.textContent = "vs"; h.append(v, " " + m[2]); }
else h.textContent = t;
if (t.length > 22) h.classList.add("long");
document.getElementById("s").textContent = q.get("s") || "";

// A speech waveform quantized with an 8x8 Bayer ordered dither, 1-bit ink on
// paper, fading in from the left (same grammar as the site hero).
const B = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
           3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
const c = document.getElementById("c"), g = c.getContext("2d");
const W = 600, H = 630, CELL = 3, seed = (q.get("t") || "").length;
const hash = (x) => { const s = Math.sin(x * 127.1 + seed * 31.7) * 43758.5453; return s - Math.floor(s); };
const noise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; };
g.fillStyle = "#1d2027";
for (let y = 0; y < H; y += CELL) for (let x = 0; x < W; x += CELL) {
  const px = x / W, cy = 0.52;
  const syl = Math.min(1, Math.max(0, (noise(px * 9 + 3) - 0.25) / 0.6));
  const phr = Math.min(1, Math.max(0, (noise(px * 2.1 + 11) - 0.15) / 0.55));
  const env = syl * phr * 0.9 + 0.08;
  const carrier = 0.55 + 0.45 * Math.abs(Math.sin(px * 140) * Math.sin(px * 37 + 1));
  const amp = env * carrier * 0.36;
  const d = Math.abs(y / H - cy);
  let body = d < amp ? (1 - d / Math.max(amp, 1e-3)) * 0.9 + 0.1 : 0;
  let rib = 0;
  for (let i = 0; i < 3; i++) {
    const yy = cy + (0.1 + 0.05 * i) * (0.4 + env) * Math.sin(px * (6 + 2.5 * i) + i * 1.9);
    rib = Math.max(rib, Math.max(0, 1 - Math.abs(y / H - yy) / (0.01 + 0.004 * i)) * (0.6 - 0.12 * i));
  }
  let f = Math.max(body, rib) * Math.min(1, Math.max(0, (px - 0.08) / 0.5)) * Math.min(1, (1 - px) / 0.12);
  const th = (B[((y / CELL) % 8) * 8 + ((x / CELL) % 8)] + 0.5) / 64;
  if (f * 1.2 > th) g.fillRect(x, y, CELL - 1, CELL - 1);
}
document.fonts.ready.then(() => document.body.setAttribute("data-ready", "1"));
</script>
</body>
</html>
