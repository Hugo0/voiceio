name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install package
        run: pip install -e ".[desktop,server,dev]"

      - name: Run tests
        run: python -m pytest tests/ -x -q

  headless:
    # A server install must work with no audio/input/display stack at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install server extra only
        run: pip install ".[server]"

      - name: Import the headless entry points
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          for mod in ("sounddevice", "evdev", "pynput", "pystray"):
              assert importlib.util.find_spec(mod) is None, f"{mod} leaked into a server install"
          import voiceio.core.engine
          import voiceio.server
          import voiceio.server.app
          print("headless install OK")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.15,<0.18"

      - name: Run ruff
        run: ruff check voiceio/
