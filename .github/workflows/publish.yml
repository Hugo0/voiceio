name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    # Gate: never publish a build whose tests fail (0.4.1 shipped on red CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev
      - name: Install package
        run: pip install -e ".[desktop,server,dev]"
      - name: Run tests
        run: pytest tests/ -x -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          # --generate-notes appends the changes since the previous tag.
          gh release create "$VERSION" dist/* --generate-notes --notes "$(cat <<NOTES
          ## Install

          \`\`\`bash
          pipx install 'python-voiceio[desktop]'
          voiceio setup
          \`\`\`

          See the README for distro packages and NixOS. Coming from 0.9.x? Read
          [UPGRADING.md](https://github.com/Hugo0/voiceio/blob/${VERSION}/UPGRADING.md).

          ## SHA-256

          \`\`\`
          $(cd dist && sha256sum *)
          \`\`\`
          NOTES
          )"
