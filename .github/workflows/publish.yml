name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    # Gate: never publish a build whose tests fail (0.4.1 shipped on red CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev
      - name: Install package
        run: pip install -e ".[desktop,server,dev]"
      - name: Run tests
        run: pytest tests/ -x -q

  deb:
    # One .deb for every Debian/Ubuntu release (it bundles its own Python).
    # Built on the oldest supported release so evdev links the oldest glibc.
    # Nothing waits on it but deb-release, so a broken .deb build never holds
    # back PyPI.
    needs: test
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git gcc libc6-dev linux-libc-dev binutils libportaudio2
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Build .deb
        run: packaging/deb/build-deb.sh dist/*.whl deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: deb/*.deb
          if-no-files-found: error

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          # --generate-notes appends the changes since the previous tag.
          gh release create "$VERSION" dist/* --generate-notes --notes "$(cat <<NOTES
          ## Install

          \`\`\`bash
          pipx install 'python-voiceio[desktop]'
          voiceio setup
          \`\`\`

          Debian / Ubuntu (22.04+): download \`voiceio_*.deb\` below (attached a
          few minutes after the release), then
          \`sudo apt install ./voiceio_*.deb && voiceio setup\`.

          See the README for other distros and NixOS. Coming from 0.9.x? Read
          [UPGRADING.md](https://github.com/Hugo0/voiceio/blob/${VERSION}/UPGRADING.md).

          ## SHA-256

          \`\`\`
          $(cd dist && sha256sum *)
          \`\`\`
          NOTES
          )"

  deb-release:
    needs: [publish, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" deb/*.deb --clobber
          body="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          sums="$(cd deb && sha256sum *.deb)"
          gh release edit "$GITHUB_REF_NAME" --notes "$(printf '%s\n\n.deb SHA-256:\n\n```\n%s\n```\n' "$body" "$sums")"

  aur:
    # Points the AUR package at the release just published to PyPI. Pushes
    # only when the AUR_SSH_PRIVATE_KEY secret is set (see packaging/README.md);
    # otherwise the updated PKGBUILD and .SRCINFO are attached to the release.
    needs: publish
    # Best effort: a failed AUR push must not mark the release failed (the
    # package test only runs after a successful release).
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Update PKGBUILD and .SRCINFO
        run: packaging/aur/update.sh "${GITHUB_REF_NAME#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packaging/aur
          cp .SRCINFO SRCINFO
          gh release upload "$GITHUB_REF_NAME" PKGBUILD SRCINFO --clobber
      - name: Push to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "voiceio release CI"
          git config --global user.email "noreply@voiceio.dev"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes" packaging/aur/publish.sh
