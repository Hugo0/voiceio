name: sherpa-onnx PR test

# Builds a Hugo0/sherpa-onnx branch (one Python, no binaries) and decodes the
# Parakeet-110M test clips with greedy and modified_beam_search, setting
# length_reward per stream. For checking upstream PR changes off the laptop;
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Hugo0/sherpa-onnx branch, tag or commit"
        default: fix-nemo-tdt-modified-beam-search

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Hugo0/sherpa-onnx
          ref: ${{ inputs.ref }}
          path: sherpa-onnx
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          SHERPA_ONNX_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=Release -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF -DSHERPA_ONNX_ENABLE_BINARY=OFF
          SHERPA_ONNX_MAKE_ARGS: "-j4"
        run: pip install cmake setuptools wheel numpy && pip install -v ./sherpa-onnx 2>&1 | tail -5
      - name: Model
        run: |
          name=sherpa-onnx-nemo-parakeet_tdt_transducer_110m-en-36000-int8
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2 | tar xj
          mv $name model
      - name: Decode
        shell: python
        run: |
          import math, wave
          import numpy as np
          import sherpa_onnx as so

          def read(path):
              with wave.open(path) as w:
                  a = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16)
                  return a.astype(np.float32) / 32768, w.getframerate()

          def recognizer(method):
              return so.OfflineRecognizer.from_transducer(
                  tokens="model/tokens.txt", encoder="model/encoder.int8.onnx",
                  decoder="model/decoder.int8.onnx", joiner="model/joiner.int8.onnx",
                  model_type="nemo_transducer", decoding_method=method, max_active_paths=4)

          clips = ["model/test_wavs/0.wav", "model/test_wavs/en-english.wav"]
          greedy, beam = recognizer("greedy_search"), recognizer("modified_beam_search")

          def decode(rec, path, reward=None):
              s = rec.create_stream()
              if reward is not None:
                  s.set_option("length_reward", reward)
              s.accept_waveform(*read(path)[::-1])
              rec.decode_stream(s)
              return s.result.text.strip()

          for clip in clips:
              g = decode(greedy, clip)
              runs = {r: decode(beam, clip, r) for r in (None, "0", "0.5", "nan")}
              print(clip, "\n  greedy     :", g)
              for r, t in runs.items():
                  print(f"  mbs {str(r):<7}:", t)
              assert all(runs.values()), "beam search returned empty text"
              assert runs[None] == runs["0"] == runs["nan"], "default, 0 and nan must decode alike"
              assert len(runs["0.5"].split()) >= len(runs["0"].split()), "a length reward must not lose words"
          print("ok")
