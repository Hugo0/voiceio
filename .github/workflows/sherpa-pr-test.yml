name: sherpa-onnx PR test

# Builds a Hugo0/sherpa-onnx branch (one Python, plus the CLI binaries) and
# decodes the Parakeet-110M test clips with greedy and modified_beam_search,
# setting length_reward per stream, from Python and from sherpa-onnx-offline. For checking upstream PR changes off the laptop;
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Hugo0/sherpa-onnx branch, tag or commit"
        default: fix-nemo-tdt-modified-beam-search

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Hugo0/sherpa-onnx
          ref: ${{ inputs.ref }}
          path: sherpa-onnx
      - uses: actions/checkout@v6
        with:
          path: voiceio
          sparse-checkout: .github/sherpa-pr-test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          SHERPA_ONNX_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=Release -DSHERPA_ONNX_ENABLE_PORTAUDIO=ON
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF -DSHERPA_ONNX_ENABLE_BINARY=ON
          SHERPA_ONNX_MAKE_ARGS: "-j4"
        run: |
          sudo apt-get install -qq -y libasound2-dev > /dev/null
          pip install cmake setuptools wheel numpy
          if ! pip install --no-build-isolation -v ./sherpa-onnx > build.log 2>&1; then
            grep -nE "error:|Error [0-9]|CMake Error" build.log | head -40
            tail -80 build.log
            exit 1
          fi
          tail -3 build.log
      - name: Model
        run: |
          name=sherpa-onnx-nemo-parakeet_tdt_transducer_110m-en-36000-int8
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2 | tar xj
          mv $name model
      - name: Decode
        shell: python
        run: |
          import math, wave
          import numpy as np
          import sherpa_onnx as so

          def read(path):
              with wave.open(path) as w:
                  a = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16)
                  return a.astype(np.float32) / 32768, w.getframerate()

          def recognizer(method):
              return so.OfflineRecognizer.from_transducer(
                  tokens="model/tokens.txt", encoder="model/encoder.int8.onnx",
                  decoder="model/decoder.int8.onnx", joiner="model/joiner.int8.onnx",
                  model_type="nemo_transducer", decoding_method=method, max_active_paths=4)

          clips = ["model/test_wavs/0.wav", "model/test_wavs/en-english.wav"]
          greedy, beam = recognizer("greedy_search"), recognizer("modified_beam_search")

          def decode(rec, path, reward=None):
              s = rec.create_stream()
              if reward is not None:
                  s.set_option("length_reward", reward)
              s.accept_waveform(*read(path)[::-1])
              rec.decode_stream(s)
              return s.result.text.strip()

          for clip in clips:
              g = decode(greedy, clip)
              runs = {r: decode(beam, clip, r) for r in (None, "0", "0.5", "nan")}
              print(clip, "\n  greedy     :", g)
              for r, t in runs.items():
                  print(f"  mbs {str(r):<7}:", t)
              assert all(runs.values()), "beam search returned empty text"
              assert runs[None] == runs["0"] == runs["nan"], "default, 0 and nan must decode alike"
              assert len(runs["0.5"].split()) >= len(runs["0"].split()), "a length reward must not lose words"
          print("ok")
      - name: CLI
        run: |
          exe=$(command -v sherpa-onnx-offline || find "$(python -c 'import sys; print(sys.prefix)')" -name sherpa-onnx-offline -type f | head -1)
          test -x "$exe"
          for r in 0 0.5; do
            echo "== --length-reward=$r"
            "$exe" --tokens=model/tokens.txt --encoder=model/encoder.int8.onnx \
              --decoder=model/decoder.int8.onnx --joiner=model/joiner.int8.onnx \
              --model-type=nemo_transducer --decoding-method=modified_beam_search \
              --length-reward=$r model/test_wavs/0.wav model/test_wavs/en-english.wav 2>&1 | tee cli-$r.log | tail -8
          done
          ! grep -q "Invalid option" cli-0.5.log
      - name: Reproducer (LibriSpeech test-clean with pauses, parakeet-tdt-0.6b-v3-int8)
        run: |
          curl -fsSL https://www.openslr.org/resources/12/test-clean.tar.gz | tar xz
          name=sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2 | tar xj
          pip install -q soundfile
          for r in 0 0.5; do
            echo "== length_reward $r (set per stream)"
            python voiceio/.github/sherpa-pr-test/repro_tdt_mbs.py --librispeech LibriSpeech/test-clean --model $name --length-reward $r
          done
